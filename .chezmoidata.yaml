# Bitwarden naming convention for dotfile secrets
bitwarden:
  folders:
    shared: "dotfiles/shared"
    client: "dotfiles/client"
    personal: "dotfiles/personal"

# Tool configurations
tools:
  mise:
    # Global runtime versions - used in config.toml template
    global_tools:
      node: "lts"
      python: "3.12"
      go: "1.22"
      rust: "stable"
      java: "temurin-25"
      ruby: "3"
      terraform: "1.9"
    settings:
      jobs: 4
      not_found_auto_install: true
      exec_auto_install: true
      idiomatic_version_files:
        - node
        - python
  sheldon:
    # Plugin list goes here when needed
