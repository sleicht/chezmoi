$schema:
  https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
console_title_template: '{{ .Folder }}'
final_space: true
version: 4
transient_prompt:
  foreground: '#62ED8B'
  newline: true
  template: '{{ with .Segments.git }}{{ .UpstreamIcon }}{{ abbrevboth 12 22 .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ end }} ❯ '
blocks:
  - alignment: left
    type: prompt
    segments:
      - type: git
        alias: git
        style: plain
        template: "\u200B"
        options:
          fetch_status: true
          fetch_upstream_icon: true
      - foreground: '#E36464'
        style: plain
        template: ' {{ .Icon }} '
        type: os
      - foreground: '#D4AAFC'
        style: plain
        template: ' {{ .Shell }} '
        type: session
      - template: '  '
        foreground: '#E36464'
        type: root
        style: plain
      - foreground: '#56B6C2'
        style: plain
        template: ' {{ .Path }} '
        type: path
        options:
          style: agnoster_short
          max_depth: 2
          max_width: 30
      - template: '  {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{
      .Full }} '
        foreground: '#62ED8B'
        type: node
        style: plain
        options:
          fetch_version: true
      - foreground: '#E36464'
        style: plain
        template: '  {{ .Full }}'
        type: java
      - foreground: '#D4AAFC'
        style: plain
        template: ' <b>K</b> {{ .Full }} '
        type: kotlin
      - foreground: '#DDB15F'
        style: plain
        template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}  '
        type: python
        options:
          display_mode: files
          fetch_virtual_env: false
      - foreground: '#E36464'
        style: plain
        template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}  '
        type: ruby
        options:
          display_mode: files
          fetch_version: true
      - foreground: '#56B6C2'
        style: plain
        template: '  {{abbrevboth 10 15 .Project}}{{ if .Region }}@{{ .Region }}{{ end
      }}   '
        type: gcp
        options:
          display_default: false
      - foreground: '#D4AAFC'
        style: plain
        template: '{{ if .Version }} {{ .Version }}{{ end }}'
        type: terraform
      - foreground: '#DCB977'
        style: plain
        template: ' {{ .FormattedMs }}  '
        type: executiontime
      - foreground: '#DCB977'
        style: plain
        template: ' {{ .CurrentDate | date .Format }}  '
        type: time
        options:
          time_format: 15:04
      - template: ' ❯ '
        foreground: '#DCB977'
        type: status
        style: plain
        foreground_templates:
          - '{{ if gt .Code 0 }}#E36464{{ end }}'
        options:
          always_enabled: true
