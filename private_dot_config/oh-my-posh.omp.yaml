$schema:
  https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
console_title_template: '{{ .Folder }}'
final_space: true
version: 4
transient_prompt:
  background: transparent
  foreground: lightGreen
  newline: true
  template: '{{ with .Segments.git }}{{ .UpstreamIcon }}{{ abbrevboth 12 22 .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ end }} ❯ '
blocks:
  - alignment: left
    type: prompt
    segments:
      - type: git
        alias: git
        style: plain
        template: "\u200B"
        options:
          fetch_status: true
          fetch_upstream_icon: true
      - background: '#546E7A'
        foreground: '#26C6DA'
        leading_diamond: 
        style: plain
        template: ' {{ .Icon }} '
        type: os
      - background: '#6272a4'
        foreground: '#f8f8f2'
        style: diamond
        template: ' {{ .Shell }} '
        type: session
      - template: '  '
        foreground: '#26C6DA'
        background: '#546E7A'
        type: root
        style: plain
      - background: '#bd93f9'
        foreground: '#f8f8f2'
        powerline_symbol: 
        style: powerline
        template: ' {{ .Path }} '
        type: path
        options:
          style: agnoster_short
          max_depth: 2
          max_width: 30
      - template: '  {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{
      .Full }} '
        foreground: '#f8f8f2'
        powerline_symbol: 
        background: '#8be9fd'
        type: node
        style: powerline
        options:
          fetch_version: true
      - background: '#4063D8'
        foreground: '#ffffff'
        powerline_symbol: 
        style: powerline
        template: '  {{ .Full }}'
        type: java
      - background: '#906cff'
        foreground: '#ffffff'
        powerline_symbol: 
        style: powerline
        template: ' <b>K</b> {{ .Full }} '
        type: kotlin
      - background: '#FFDE57'
        foreground: '#111111'
        powerline_symbol: 
        style: powerline
        template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}  '
        type: python
        options:
          display_mode: files
          fetch_virtual_env: false
      - background: '#AE1401'
        foreground: '#ffffff'
        powerline_symbol: 
        style: powerline
        template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}  '
        type: ruby
        options:
          display_mode: files
          fetch_version: true
      - background: '#47888d'
        foreground: '#ffffff'
        powerline_symbol: 
        style: powerline
        template: '  {{abbrevboth 10 15 .Project}}{{ if .Region }}@{{ .Region }}{{ end
      }}   '
        type: gcp
        options:
          display_default: false
      - background: '#ebcc34'
        foreground: '#000000'
        powerline_symbol: 
        style: powerline
        template: '{{ if .Version }} {{ .Version }}{{ end }}'
        type: terraform
      - background: '#c4a000'
        foreground: '#000000'
        powerline_symbol: 
        style: powerline
        template: ' {{ .FormattedMs }}  '
        type: executiontime
      - background: '#ff79c6'
        foreground: '#f8f8f2'
        style: diamond
        template: ' {{ .CurrentDate | date .Format }}  '
        trailing_diamond: 
        type: time
        options:
          time_format: 15:04
      - template: ' ❯ '
        foreground: '#d3d7cf'
        powerline_symbol: 
        background: transparent
        type: status
        style: plain
        foreground_templates:
          - '{{ if gt .Code 0 }}#cc2222{{ end }}'
        options:
          always_enabled: true
