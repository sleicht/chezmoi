# Reference: https://github.com/i3/i3/blob/next/etc/config

config-version = 2

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = false

# In i3, all workspaces are phantom
persistent-workspaces = ["1"]

# i3 doesn't have "normalizations" feature that why we disable them here.
# But the feature is very helpful.
# Normalizations eliminate all sorts of weird tree configurations that don't make sense.
# Give normalizations a chance and enable them back.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Notify Sketchybar about workspace change
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE',
]

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 20
outer.bottom = 20
outer.top = [{ monitor."DELL U2725QE" = 44 }, 14] # 14
outer.right = 20

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right
cmd-h = [] # Disable "hide application"
cmd-alt-h = [] # Disable "hide others"

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# You can uncomment the following lines to open up terminal with alt + enter shortcut (like in i3)
# alt-enter = '''exec-and-forget osascript -e '
# tell application "Terminal"
#     do script
#     activate
# end tell'
# '''

# i3 wraps focus by default
alt-j =         'focus --boundaries-action wrap-around-the-workspace left'
alt-k =         'focus --boundaries-action wrap-around-the-workspace down'
alt-l =         'focus --boundaries-action wrap-around-the-workspace up'
alt-semicolon = 'focus --boundaries-action wrap-around-the-workspace right'

alt-shift-j = 'move left'
alt-shift-k = 'move down'
alt-shift-l = 'move up'
alt-shift-semicolon = 'move right'

# Consider using 'join-with' command as a 'split' replacement if you want to enable
# normalizations
alt-h = 'join-with down'
alt-v = 'join-with left'

alt-f = 'fullscreen'

alt-s = 'layout v_accordion' # 'layout stacking' in i3
alt-w = 'layout h_accordion' # 'layout tabbed' in i3
alt-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3

alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3

# Not supported, because this command is redundant in AeroSpace mental model.
# See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows
#alt-space = 'focus toggle_tiling_floating'

# `focus parent`/`focus child` are not yet supported, and it's not clear whether they
# should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
# alt-a = 'focus parent'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
ctrl-alt-1 = 'workspace 1'
ctrl-alt-2 = 'workspace 2'
ctrl-alt-3 = 'workspace 3'
#ctrl-alt-4 = 'workspace 4'
ctrl-alt-5 = 'workspace 5'
ctrl-alt-6 = 'workspace 6'
#ctrl-alt-7 = 'workspace 7'
#ctrl-alt-8 = 'workspace 8'
#ctrl-alt-9 = 'workspace 9'
#ctrl-alt-a = 'workspace A' # In your config, you can drop workspace bindings that you don't need
ctrl-alt-b = 'workspace B'
#ctrl-alt-c = 'workspace C'
#ctrl-alt-d = 'workspace D'
ctrl-alt-e = 'workspace E'
#ctrl-alt-f = 'workspace F'
ctrl-alt-g = 'workspace G'
ctrl-alt-i = 'workspace I'
ctrl-alt-m = 'workspace M'
#ctrl-alt-n = 'workspace N'
#ctrl-alt-o = 'workspace O'
#ctrl-alt-p = 'workspace P'
#ctrl-alt-q = 'workspace Q'
#ctrl-alt-r = 'workspace R'
ctrl-alt-s = 'workspace S'
ctrl-alt-t = 'workspace T'
#ctrl-alt-u = 'workspace U'
#ctrl-alt-v = 'workspace V'
ctrl-alt-w = 'workspace W'
#ctrl-alt-x = 'workspace X'
#ctrl-alt-y = 'workspace Y'
#ctrl-alt-z = 'workspace Z'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
# --focus-follows-window is used to ensure workspace changes to trigger the callback for sketchybar to update
alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
#alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
#alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
#alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
#alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
#alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
#alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'
#alt-shift-a = 'move-node-to-workspace A --focus-follows-window'
alt-shift-b = 'move-node-to-workspace B --focus-follows-window'
#alt-shift-c = 'move-node-to-workspace C --focus-follows-window'
#alt-shift-d = 'move-node-to-workspace D --focus-follows-window'
alt-shift-e = 'move-node-to-workspace E --focus-follows-window'
#alt-shift-f = 'move-node-to-workspace F' # disabled as it's a common code format hotkey
alt-shift-g = 'move-node-to-workspace G --focus-follows-window'
alt-shift-i = 'move-node-to-workspace I --focus-follows-window' # IDE
alt-shift-m = 'move-node-to-workspace M --focus-follows-window' # Mail
#alt-shift-n = 'move-node-to-workspace N --focus-follows-window'
#alt-shift-o = 'move-node-to-workspace O --focus-follows-window'
#alt-shift-p = 'move-node-to-workspace P --focus-follows-window'
#alt-shift-q = 'move-node-to-workspace Q --focus-follows-window'
#alt-shift-r = 'move-node-to-workspace R --focus-follows-window'
alt-shift-s = 'move-node-to-workspace S --focus-follows-window' # Social
alt-shift-t = 'move-node-to-workspace T --focus-follows-window' # Terminal
#alt-shift-u = 'move-node-to-workspace U --focus-follows-window'
#alt-shift-v = 'move-node-to-workspace V --focus-follows-window'
alt-shift-w = 'move-node-to-workspace W --focus-follows-window' # Web
#alt-shift-x = 'move-node-to-workspace X --focus-follows-window'
#alt-shift-y = 'move-node-to-workspace Y --focus-follows-window'
#alt-shift-z = 'move-node-to-workspace Z --focus-follows-window'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
alt-shift-tab = [
  'move-workspace-to-monitor --wrap-around next',
  'exec-and-forget sketchybar --trigger aerospace_monitor_change TARGET_MONITOR=$(aerospace list-monitors --focused --format "%{monitor-appkit-nsscreen-screens-id}") FOCUSED_WORKSPACE=$(aerospace list-workspaces --focused)',
]

alt-shift-c = 'reload-config'

alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
  'layout floating tiling',
  'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# Window detection rules
[[on-window-detected]]
check-further-callbacks = true
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.readdle.SparkDesktop'
run = 'move-node-to-workspace M' # mnemonics M - Mail

[[on-window-detected]]
if.app-id = 'com.flexibits.fantastical2.mac'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-id = 'com.jetbrains.intellij'
run = 'move-node-to-workspace I' # mnemonics I - IDE

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = 'move-node-to-workspace S' # mnemonics S - Social

[[on-window-detected]]
if.app-id = 'ch.threema.threema-desktop'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.infomaniak.chat'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
check-further-callbacks = false
run = ['layout floating', 'move-node-to-workspace T'] # Terminal — floating preserves native tabs

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace W' # Web

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace W' # mnemonics W - Web browser
