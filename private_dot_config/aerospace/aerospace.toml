# Pop!_OS COSMIC-style key bindings for AeroSpace
# 'ctrl' (⌃) = Linux Super/Windows key equivalent
# Reference: https://support.system76.com/articles/pop-cosmic-keyboard-shortcuts/

config-version = 2

after-login-command = []

# Move already-open windows to their workspaces on startup
after-startup-command = ['''exec-and-forget bash -c '
  move() {
    aerospace list-windows --monitor all --app-bundle-id "$1" --format "%{window-id}" 2>/dev/null \
      | while read -r wid; do aerospace move-node-to-workspace --window-id "$wid" "$2"; done
  }
  float_move() {
    aerospace list-windows --monitor all --app-bundle-id "$1" --format "%{window-id}" 2>/dev/null \
      | while read -r wid; do aerospace layout --window-id "$wid" floating; aerospace move-node-to-workspace --window-id "$wid" "$2"; done
  }
  move com.readdle.SparkDesktop M
  move com.flexibits.fantastical2.mac M
  move com.jetbrains.intellij I
  move net.whatsapp.WhatsApp S
  move ch.threema.threema-desktop S
  move com.infomaniak.chat S
  move com.apple.MobileSMS S
  float_move com.mitchellh.ghostty T
  move com.t3tools.t3code T
  move com.gitbutler.app T
  move com.google.Chrome W
  move app.zen-browser.zen W
  move com.vivaldi.Vivaldi W
  float_move com.sublimetext.4 I
  float_move com.apple.finder 1
  float_move com.cocoatech.PathFinder 1
  float_move io.tailscale.ipn.macos 1
'
''']

# Start AeroSpace at login
start-at-login = false

# Keep workspace 1 always available
persistent-workspaces = ["1"]

# Normalizations keep the tree sane — Cosmic also uses a tree-based tiling model
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Prevent macOS from hiding apps (cmd is our Super key, so cmd-h conflicts)
automatically-unhide-macos-hidden-apps = false

# Notify Sketchybar about workspace change
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE',
]

[key-mapping]
preset = 'qwerty'

# ── Gaps ──────────────────────────────────────────────────────────────────────
# Cosmic Desktop has gaps between tiled windows by default
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 20
outer.bottom = 20
outer.top = [{ monitor."DELL U2725QE" = 44 }, 14]
outer.right = 20

# ── Main Bindings ─────────────────────────────────────────────────────────────
[mode.main.binding]

# ── Navigation ────────────────────────────────────────────────────────────────

# Ctrl + Arrow keys → Focus window in direction
ctrl-left  = 'focus left'
ctrl-down  = 'focus down'
ctrl-up    = 'focus up'
ctrl-right = 'focus right'

# Ctrl + Alt + Arrow keys → Focus next/prev monitor
ctrl-alt-left  = 'focus-monitor --wrap-around prev'
ctrl-alt-right = 'focus-monitor --wrap-around next'

# Ctrl + Shift + Arrow keys → Navigate between workspaces
ctrl-shift-up    = 'workspace prev'
ctrl-shift-down  = 'workspace next'
ctrl-shift-left  = 'workspace prev'
ctrl-shift-right = 'workspace next'

# Ctrl + 1-6 → Switch to numbered workspace
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'
ctrl-3 = 'workspace 3'
ctrl-5 = 'workspace 5'
ctrl-6 = 'workspace 6'

# Ctrl + letter → Switch to named workspace (mnemonic)
ctrl-b = 'workspace B'
ctrl-e = 'workspace E'
ctrl-g = 'workspace G'       # General
ctrl-i = 'workspace I'       # IDE
ctrl-m = 'workspace M'       # Mail
ctrl-s = 'workspace S'       # Social
ctrl-t = 'workspace T'       # Terminal
ctrl-w = 'workspace W'       # Web

# Ctrl + 0 → Last used workspace (back-and-forth)
ctrl-0 = 'workspace-back-and-forth'

# ── Move Windows ──────────────────────────────────────────────────────────────

# Ctrl + Shift + Arrow keys are used for workspace nav, so use Ctrl + Alt for moving
# Ctrl + Alt + Arrow keys → Move window in tiling layout
ctrl-alt-j     = 'move left'
ctrl-alt-k     = 'move down'
ctrl-alt-l     = 'move up'
ctrl-alt-semicolon = 'move right'

# Ctrl + Alt + Shift + Arrow keys → Move window to next/prev monitor
ctrl-alt-shift-left  = 'move-node-to-monitor --wrap-around prev'
ctrl-alt-shift-right = 'move-node-to-monitor --wrap-around next'

# Ctrl + Alt + Shift + Up/Down → Move window to prev/next workspace
ctrl-alt-shift-up    = 'move-node-to-workspace prev --focus-follows-window'
ctrl-alt-shift-down  = 'move-node-to-workspace next --focus-follows-window'

# Ctrl + Shift + number → Move window to numbered workspace
ctrl-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
ctrl-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
ctrl-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
ctrl-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
ctrl-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'

# ── Manage Windows ────────────────────────────────────────────────────────────

# Ctrl + Q → Close window
ctrl-q = 'close'

# Ctrl + F → Maximize/fullscreen toggle
ctrl-f = 'fullscreen'

# Ctrl + F11 → Fullscreen (alternate)
ctrl-f11 = 'fullscreen'

# Ctrl + Enter → Launch terminal
ctrl-enter = '''exec-and-forget osascript -e '
tell application "Ghostty"
    activate
end tell'
'''

# Ctrl + R → Enter resize mode
ctrl-r = 'mode resize'

# Ctrl + Shift + F → Toggle floating/tiling
ctrl-shift-f = 'layout floating tiling'

# Ctrl + O → Flip tile orientation (horizontal ↔ vertical)
ctrl-o = 'layout tiles horizontal vertical'

# Ctrl + Shift + S conflicts with workspace S, use Alt + S for stacking
alt-s = 'layout accordion tiling'

# ── Workspace / Monitor ──────────────────────────────────────────────────────

# Alt + Tab → Back and forth between last workspaces
alt-tab = 'workspace-back-and-forth'

# Alt + Shift + Tab → Move workspace to next monitor
alt-shift-tab = [
  'move-workspace-to-monitor --wrap-around next',
  'exec-and-forget sketchybar --trigger aerospace_monitor_change TARGET_MONITOR=$(aerospace list-monitors --focused --format "%{monitor-appkit-nsscreen-screens-id}") FOCUSED_WORKSPACE=$(aerospace list-workspaces --focused)',
]

# ── Service / Config Reload ──────────────────────────────────────────────────
alt-shift-semicolon = 'mode service'
alt-shift-c = 'reload-config'

# ── Resize Mode ──────────────────────────────────────────────────────────────
[mode.resize.binding]
esc   = 'mode main'
enter = 'mode main'

right       = 'resize width +50'
shift-right = 'resize width -50'
left        = 'resize width -50'
shift-left  = 'resize width +50'
down        = 'resize height +50'
shift-down  = 'resize height -50'
up          = 'resize height -50'
shift-up    = 'resize height +50'

# ── Service Mode ─────────────────────────────────────────────────────────────
[mode.service.binding]
esc       = ['reload-config', 'mode main']
r         = ['flatten-workspace-tree', 'mode main'] # reset layout
f         = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Move window to named workspace (service → letter)
b = ['move-node-to-workspace B --focus-follows-window', 'mode main']
e = ['move-node-to-workspace E --focus-follows-window', 'mode main']
g = ['move-node-to-workspace G --focus-follows-window', 'mode main']
i = ['move-node-to-workspace I --focus-follows-window', 'mode main'] # IDE
m = ['move-node-to-workspace M --focus-follows-window', 'mode main'] # Mail
s = ['move-node-to-workspace S --focus-follows-window', 'mode main'] # Social
t = ['move-node-to-workspace T --focus-follows-window', 'mode main'] # Terminal
w = ['move-node-to-workspace W --focus-follows-window', 'mode main'] # Web

# ── Window Detection Rules ───────────────────────────────────────────────────
# Default: all new windows float (override per-app below)
[[on-window-detected]]
check-further-callbacks = true
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.readdle.SparkDesktop'
run = 'move-node-to-workspace M' # Mail

[[on-window-detected]]
if.app-id = 'com.flexibits.fantastical2.mac'
run = 'move-node-to-workspace M' # Mail

[[on-window-detected]]
if.app-id = 'com.jetbrains.intellij'
run = 'move-node-to-workspace I' # IDE

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = 'move-node-to-workspace S' # Social

[[on-window-detected]]
if.app-id = 'ch.threema.threema-desktop'
run = 'move-node-to-workspace S' # Social

[[on-window-detected]]
if.app-id = 'com.infomaniak.chat'
run = 'move-node-to-workspace S' # Social

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = 'move-node-to-workspace S' # Social

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
check-further-callbacks = false
run = ['layout floating', 'move-node-to-workspace T'] # Terminal — floating preserves native tabs

[[on-window-detected]]
if.app-id = 'com.t3tools.t3code'
run = 'move-node-to-workspace T' # Terminal

[[on-window-detected]]
if.app-id = 'com.gitbutler.app'
run = 'move-node-to-workspace T' # Terminal

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace W' # Web

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace W' # Web

[[on-window-detected]]
if.app-id = 'com.vivaldi.Vivaldi'
run = 'move-node-to-workspace W' # Web

[[on-window-detected]]
if.app-id = 'com.sublimetext.4'
check-further-callbacks = false
run = ['layout floating', 'move-node-to-workspace I'] # IDE — floating

[[on-window-detected]]
if.app-id = 'com.apple.finder'
check-further-callbacks = false
run = ['layout floating', 'move-node-to-workspace 1'] # Floating on workspace 1

[[on-window-detected]]
if.app-id = 'com.cocoatech.PathFinder'
check-further-callbacks = false
run = ['layout floating', 'move-node-to-workspace 1'] # Floating on workspace 1

[[on-window-detected]]
if.app-id = 'io.tailscale.ipn.macos'
check-further-callbacks = false
run = ['layout floating', 'move-node-to-workspace 1'] # Floating on workspace 1
