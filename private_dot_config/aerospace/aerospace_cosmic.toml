# ~/.aerospace.toml
# Pop!_OS COSMIC-style key bindings for AeroSpace
# 'cmd' (⌘) = Linux Super/Windows key equivalent

[mode.main.binding]

# ── Navigation ─────────────────────────────────────────────────────────────────

# Super + Arrow keys → Focus window in direction
cmd-left  = 'focus left'
cmd-down  = 'focus down'
cmd-up    = 'focus up'
cmd-right = 'focus right'

# Super + Alt + Arrow keys → Focus next/prev monitor
cmd-alt-left  = 'focus-monitor --wrap-around prev'
cmd-alt-right = 'focus-monitor --wrap-around next'

# Super + Ctrl + Arrow keys → Navigate between workspaces
cmd-ctrl-up    = 'workspace prev'
cmd-ctrl-down  = 'workspace next'
cmd-ctrl-left  = 'workspace prev'
cmd-ctrl-right = 'workspace next'

# Super + 1-9 → Switch to workspace
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'

# Super + 0 → Last used workspace
cmd-0 = 'workspace-back-and-forth'

# ── Move Windows ───────────────────────────────────────────────────────────────

# Shift + Super + Arrow keys → Move window in tiling layout
cmd-shift-left  = 'move left'
cmd-shift-down  = 'move down'
cmd-shift-up    = 'move up'
cmd-shift-right = 'move right'

# Shift + Super + Alt + Arrow keys → Move window to next/prev monitor
cmd-shift-alt-left  = 'move-node-to-monitor --wrap-around prev'
cmd-shift-alt-right = 'move-node-to-monitor --wrap-around next'

# Shift + Super + Ctrl + Arrow keys → Move window to next/prev workspace
cmd-shift-ctrl-up    = 'move-node-to-workspace prev'
cmd-shift-ctrl-down  = 'move-node-to-workspace next'
cmd-shift-ctrl-left  = 'move-node-to-workspace prev'
cmd-shift-ctrl-right = 'move-node-to-workspace next'

# Shift + Super + 1-9 → Move window to specific workspace
cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'

# ── Manage Windows ─────────────────────────────────────────────────────────────

# Super + Q → Close window
cmd-q   = 'close'

# Super + F11 → Fullscreen
cmd-f11 = 'fullscreen'

# Super + R → Enter resize mode
cmd-r   = 'mode resize'

# Super + G → Toggle floating/tiling
cmd-g   = 'layout floating tiling'

# Super + O → Flip tile orientation (horizontal ↔ vertical)
cmd-o   = 'layout tiles horizontal vertical'

# Super + S → Toggle stacking
cmd-s   = 'layout accordion tiling'

# ── Service / Config Reload ────────────────────────────────────────────────────
alt-shift-semicolon = 'mode service'


# ── Resize Mode ────────────────────────────────────────────────────────────────
[mode.resize.binding]
esc   = 'mode main'
enter = 'mode main'

right       = 'resize width +50'
shift-right = 'resize width -50'
left        = 'resize width -50'
shift-left  = 'resize width +50'
down        = 'resize height +50'
shift-down  = 'resize height -50'
up          = 'resize height -50'
shift-up    = 'resize height +50'


# ── Service Mode ───────────────────────────────────────────────────────────────
[mode.service.binding]
esc       = ['reload-config', 'mode main']
r         = ['flatten-workspace-tree', 'mode main']
f         = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
