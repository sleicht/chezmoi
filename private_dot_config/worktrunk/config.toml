# Worktree path template — mirrors Phantom layout
# e.g. ~/git/ms/project/develop → ~/git/ms/project/feature-name
worktree-path = "{{ repo_path }}/../{{ branch | sanitize }}"

[commit]
stage = "all"

[commit.generation]
command = "claude -p --model=haiku"
template = """
Write a commit message for the staged changes below.

<format>
Follow Conventional Commits with a Jira ticket prefix.
Format: <jira-ticket>: <type>[scope]: <description>

Examples:
- MLE-999: feat: allow provided config object to extend other configs
- MLE-999: fix(auth): correct token validation logic

Rules:
- Imperative present tense ("add" not "added")
- No capitalised first letter, no trailing period
- For material changes, add blank line then body (max 10 bullet points, focus on "why" not "what")
- Output only the message, no quotes or code blocks
- Infer the Jira ticket from the branch name if possible
</format>

<diffstat>
{{ git_diff_stat }}
</diffstat>
"""

[merge]
squash = true
commit = true
rebase = true
remove = true
verify = true
